<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seyed Mohammadreza Mousavi</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --link-color: #007acc;
      --header-bg: #f5f5f5;
    }

    body.dark-mode {
      --bg-color: #121212;
      --text-color: #f5f5f5;
      --link-color: #66ccff;
      --header-bg: #1f1f1f;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: var(--header-bg);
      padding: 1rem;
    }

    nav {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    nav h1 {
      margin: 0.5rem;
    }

    nav ul {
      list-style: none;
      padding: 0;
      display: flex;
      gap: 1rem;
    }

    nav a {
      text-decoration: none;
      color: var(--link-color);
      font-weight: bold;
    }

    .toggle-btn {
      margin-top: 1rem;
    }

    main {
      padding: 2rem;
      text-align: center;
    }

    footer {
      background-color: var(--header-bg);
      text-align: center;
      padding: 1rem;
    }
  </style>
  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }
  </script>
</head>
<body>
  <header>
    <nav>
      <h1>Seyed Mohammadreza Mousavi</h1>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="research.html">Research</a></li>
        <li><a href="publications.html">Publications</a></li>
        <li><a href="cv.html">CV</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="toggle-btn">
        <button onclick="toggleTheme()">🌙 Toggle Dark/Light Mode</button>
      </div>
    </nav>
  </header>

  <main>
    <section>
      <h2>Welcome</h2>
      <p>This is the professional academic homepage of <strong>Seyed Mohammadreza Mousavi</strong>.</p>
      <p>Explore my research, publications, and academic work using the navigation above.</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Seyed Mohammadreza Mousavi</p>
  </footer>
</body>
</html>
