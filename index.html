<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seyed Mohammadreza Mousavi</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --link-color: #003366;
      --header-bg: #003366;
      --nav-link-color: #ffffff;
      --footer-bg: #f0f0f0;
      --footer-color: #555;
    }

    body.dark-mode {
      --bg-color: #121212;
      --text-color: #f5f5f5;
      --link-color: #66ccff;
      --header-bg: #1f1f1f;
      --nav-link-color: #ffffff;
      --footer-bg: #1a1a1a;
      --footer-color: #999;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      transition: background 0.3s, color 0.3s;
    }

    header {
      background-color: var(--header-bg);
      padding: 1.5rem;
      text-align: center;
    }

    header h1 {
      color: white;
      margin-bottom: 0.5rem;
    }

    nav ul {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      list-style: none;
      padding: 0;
      margin: 1rem 0 0 0;
    }

    nav ul li a {
      color: var(--nav-link-color);
      text-decoration: none;
      font-weight: bold;
    }

    nav ul li a:hover {
      text-decoration: underline;
    }

    .toggle-btn {
      margin-top: 1rem;
    }

    .toggle-btn button {
      padding: 0.4rem 1rem;
      border: none;
      background-color: white;
      color: var(--header-bg);
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }

    main {
      padding: 2rem;
      text-align: center;
    }

    footer {
      background-color: var(--footer-bg);
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: var(--footer-color);
    }
  </style>
  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }
  </script>
</head>
<body>
  <header>
    <h1>Seyed Mohammadreza Mousavi</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="research.html">Research</a></li>
        <li><a href="publications.html">Publications</a></li>
        <li><a href="cv.html">CV</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="toggle-btn">
      <button onclick="toggleTheme()">🌙 Toggle Dark/Light Mode</button>
    </div>
  </header>

  <main>
    <section>
      <h2>Welcome</h2>
      <p>This is the professional academic homepage of <strong>Seyed Mohammadreza Mousavi</strong>.</p>
      <p>Explore my research, publications, and academic work using the navigation above.</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Seyed Mohammadreza Mousavi</p>
  </footer>
</body>
</html>
